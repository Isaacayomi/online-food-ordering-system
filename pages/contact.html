<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | CampusEats</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/contact.css">
</head>
<body>
  <main id="main">
  <section class="auth-hero contact-hero">
    <div class="site-shell">
      <div class="auth-heading">
        <p class="eyebrow">Get in Touch</p>
        <h1>Contact Us</h1>
        <p>Questions, feedback, or a catering request? Send us a message and we'll get back to you shortly.</p>
      </div>

      <div class="contact-layout">
        <form class="auth-card contact-form" novalidate>
          <div class="form-field">
            <label for="contact-name">Full name</label>
            <input type="text" id="contact-name" name="name" placeholder="Your name" required>
          </div>

          <div class="form-field">
            <label for="contact-email">Email address</label>
            <input type="email" id="contact-email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="form-field">
            <label for="contact-subject">Subject</label>
            <input type="text" id="contact-subject" name="subject" placeholder="What's this about?">
          </div>

          <div class="form-field">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="5" placeholder="Tell us more..." required></textarea>
          </div>

          <button type="submit" class="auth-submit">Send Message</button>
        </form>

      </div>
    </div>
  </section>
</main>
  
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
</body>
</html>
