<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | CampusEats</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/menu.css">
</head>

<body>
  <main id="main">
    <section class="menu-hero">
      <div class="site-shell menu-heading">
        <p class="eyebrow">Our Menu</p>
        <h1>Made fresh, made for campus</h1>
        <p>Browse today's picks from quick bites between classes to a proper sit-down meal.</p>
      </div>

      <div class="site-shell menu-search">
        <input id="menu-search" type="search" placeholder="Search dishes, e.g. jollof, chapman…" aria-label="Search menu">
      </div>

      <div class="site-shell menu-filters" aria-label="Menu categories">
        <button class="filter-chip is-active" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-chip" type="button" data-filter="starters" aria-pressed="false">Starters</button>
        <button class="filter-chip" type="button" data-filter="mains" aria-pressed="false">Mains</button>
        <button class="filter-chip" type="button" data-filter="drinks" aria-pressed="false">Drinks</button>
        <button class="filter-chip" type="button" data-filter="desserts" aria-pressed="false">Desserts</button>
      </div>
    </section>

    <section class="menu-section site-shell">
      <div class="menu-grid" id="catalogue-grid"></div>
      <p class="menu-status" id="catalogue-status" hidden></p>
    </section>

    <section class="menu-section live-section site-shell">
      <div class="live-heading">
        <p class="eyebrow">Live Kitchen</p>
        <h2>Fresh from the international kitchen</h2>
        <p>Pulled live from TheMealDB — international dishes available today.</p>
      </div>
      <p class="menu-status" id="live-status" hidden>Loading today's international picks…</p>
      <div class="menu-grid" id="live-grid"></div>
    </section>
  </main>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/menu.js"></script>
</body>

</html>
