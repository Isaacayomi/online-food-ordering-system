<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | CampusEats</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="icon" type="image/svg+xml" href="../assets/logo-mark.svg">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/cart.css">
</head>

<body>
  <main id="main" class="cart-page">
    <section class="cart-hero">
      <p class="eyebrow">Your order</p>
      <h1>Your Cart</h1>
      <p>Review your selections before heading to checkout.</p>
    </section>
    <section class="cart-layout" aria-live="polite">
      <div class="cart-panel">
        <div class="cart-panel-heading">
          <h2>Your items <span id="cart-item-count">(0)</span></h2><button class="cart-text-button" type="button"
            id="clear-cart">Clear cart</button>
        </div>
        <div id="cart-items"></div>
        <div class="empty-cart" id="empty-cart" hidden>
          <p>Your cart is empty.</p><a href="menu.html">Browse the menu</a>
        </div>
        <a class="continue-link" href="menu.html">← Continue shopping</a>
      </div>
      <aside class="order-summary">
        <h2>Order summary</h2>
        <dl>
          <div>
            <dt>Subtotal</dt>
            <dd id="subtotal">₦0</dd>
          </div>
          <div>
            <dt>Delivery</dt>
            <dd id="delivery">—</dd>
          </div>
          <div class="summary-total">
            <dt>Total</dt>
            <dd id="total">₦0</dd>
          </div>
        </dl><a class="checkout-button" id="checkout-button" href="checkout.html">Proceed to checkout</a>
        <p>Delivery fees and estimated time are confirmed at checkout.</p>
      </aside>
    </section>
  </main>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/cart-page.js"></script>
</body>

</html>
