<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | CampusEats</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>
  <main id="main" class="auth-page">
    <section class="auth-hero" aria-labelledby="login-title">
      <div class="auth-heading"><p class="eyebrow">Welcome back</p><h1 id="login-title">Sign in to CampusEats</h1><p>Pick up right where you left off and get your favourite meals on the way.</p></div>
      <form class="auth-card" action="#" method="post">
        <div class="form-field"><label for="login-email">Email address</label><input id="login-email" name="email" type="email" autocomplete="email" placeholder="Enter your email address" required></div>
        <div class="form-field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>
        <div class="auth-options"><label class="check-label"><input type="checkbox" name="remember"> <span>Remember me</span></label><a href="#">Forgot password?</a></div>
        <button class="auth-submit" type="submit">Sign In</button><p class="auth-switch">New to CampusEats? <a href="register.html">Create an account</a></p>
      </form>
    </section>
  </main>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
</body>
</html>
