<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | CampusEats</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/register.css">
</head>
<body>
  <main id="main" class="auth-page">
    <section class="auth-hero" aria-labelledby="register-title">
      <div class="auth-heading"><p class="eyebrow">Join CampusEats</p><h1 id="register-title">Create your account</h1><p>Save your favourites, track every order, and make your next meal break effortless.</p></div>
      <form class="auth-card" id="register-form" action="#" method="post" novalidate>
        <div class="form-row"><div class="form-field"><label for="first-name">First name</label><input id="first-name" name="firstName" type="text" autocomplete="given-name" placeholder="Your first name" required></div><div class="form-field"><label for="last-name">Last name</label><input id="last-name" name="lastName" type="text" autocomplete="family-name" placeholder="Your last name" required></div></div>
        <div class="form-field"><label for="register-email">Email address</label><input id="register-email" name="email" type="email" autocomplete="email" placeholder="Enter your email address" required></div>
        <div class="form-field"><label for="register-password">Create password</label><input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required></div>
        <label class="check-label terms"><input type="checkbox" required> <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span></label>
        <p class="form-status" hidden></p>
        <button class="auth-submit" type="submit">Create Account</button><p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
      </form>
    </section>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth-pages.js"></script>
</body>
</html>
